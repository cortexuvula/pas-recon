name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: "--config signing-config.json"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to immutable commit SHAs (with the
      # human-readable ref in a trailing comment) to protect the signing/release
      # pipeline from upstream mutable-tag tampering.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Write Apple API key to temp file
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: echo "$APPLE_API_KEY_CONTENT" > "${{ runner.temp }}/apple_api_key.p8"

      - name: Install .NET sign tool (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Pin the Azure Trusted Signing `sign` tool to an exact audited
          # prerelease version instead of floating --prerelease, so upstream
          # changes can't affect signed artifacts. The `sign` tool only ships
          # as prereleases; stable-looking versions on NuGet are not .NET tools
          # and fail with "Package sign is not a .NET tool."
          dotnet tool install -g --version 0.9.1-beta.26371.2 sign
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Generate Azure signing config (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
          AZURE_PROFILE: ${{ secrets.AZURE_PROFILE }}
        run: |
          # Resolve sign.exe with forward slashes (backslashes break Tauri's signCommand parsing).
          $signExe = (Get-Command sign).Source -replace '\\', '/'
          $signCmd = "$signExe code artifact-signing --timestamp-url http://timestamp.acs.microsoft.com --artifact-signing-endpoint $env:AZURE_ENDPOINT --artifact-signing-account $env:AZURE_ACCOUNT --artifact-signing-certificate-profile $env:AZURE_PROFILE %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $signCmd } } } | ConvertTo-Json -Depth 3 -Compress
          Set-Content -Path "crates/app/signing-config.json" -Value $config

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Azure Trusted Signing (Artifact Signing) — used by the dotnet `sign`
          # tool invoked via bundle.windows.signCommand on the Windows leg.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: crates/app
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  virustotal-scan:
    needs: build-tauri
    # Only scan when the build actually produced assets. `always()` would let
    # this run (and publish a misleading "no installers" report) even if
    # build-tauri failed. Skip on cancellation; run on success only.
    if: ${{ !cancelled() && needs.build-tauri.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Download release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the tag through an env var instead of interpolating
          # ${{ github.ref_name }} into the shell, which would be an expression
          # injection risk on tag events.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p scan-assets
          set +e
          gh release download "$RELEASE_TAG" \
            --dir scan-assets \
            --pattern '*.dmg' \
            --pattern '*.exe' \
            --pattern '*.msi' \
            --pattern '*.deb' \
            --pattern '*.AppImage' \
            --pattern '*.rpm'
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # gh returns non-zero both when no pattern matches and on real
            # errors (auth, network, missing release). Query the release to
            # tell them apart: if it's reachable, a download failure just means
            # none of its assets matched installer patterns (expected); if it
            # can't be queried, fail the job instead of silently swallowing it.
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' >/dev/null 2>&1; then
              echo "Release '$RELEASE_TAG' has assets but none matched installer scan patterns; nothing to scan."
            else
              echo "gh release download failed (exit $rc) and release could not be queried; failing job."
              exit "$rc"
            fi
          fi

      - name: Scan with VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Requires the VIRUSTOTAL_API_KEY repository secret (free public key).
          python .github/scripts/vt_scan.py \
            --assets-dir scan-assets \
            --tag "$RELEASE_TAG"

      - name: Publish report + release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -f VIRUSTOTAL-REPORT.md ]; then
            gh release upload "$RELEASE_TAG" VIRUSTOTAL-REPORT.md --clobber
          else
            echo "VIRUSTOTAL-REPORT.md not produced; skipping report upload"
          fi
          # Only rewrite the release body if the script produced notes; otherwise
          # leave the existing changelog untouched (defense-in-depth).
          if [ -f release-notes.md ]; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            echo "release-notes.md not produced; leaving release body unchanged"
          fi
