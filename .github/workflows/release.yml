name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: "--config signing-config.json"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Write Apple API key to temp file
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: echo "$APPLE_API_KEY_CONTENT" > "${{ runner.temp }}/apple_api_key.p8"

      - name: Install .NET sign tool (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          dotnet tool install -g --prerelease sign
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Generate Azure signing config (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
          AZURE_PROFILE: ${{ secrets.AZURE_PROFILE }}
        run: |
          # Resolve sign.exe with forward slashes (backslashes break Tauri's signCommand parsing).
          $signExe = (Get-Command sign).Source -replace '\\', '/'
          $signCmd = "$signExe code artifact-signing --timestamp-url http://timestamp.acs.microsoft.com --artifact-signing-endpoint $env:AZURE_ENDPOINT --artifact-signing-account $env:AZURE_ACCOUNT --artifact-signing-certificate-profile $env:AZURE_PROFILE %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $signCmd } } } | ConvertTo-Json -Depth 3 -Compress
          Set-Content -Path "crates/app/signing-config.json" -Value $config

      - uses: tauri-apps/tauri-action@v0.5.19
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Azure Trusted Signing (Artifact Signing) — used by the dotnet `sign`
          # tool invoked via bundle.windows.signCommand on the Windows leg.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: crates/app
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  virustotal-scan:
    needs: build-tauri
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p scan-assets
          gh release download "${{ github.ref_name }}" \
            --dir scan-assets \
            --pattern '*.dmg' \
            --pattern '*.exe' \
            --pattern '*.msi' \
            --pattern '*.deb' \
            --pattern '*.AppImage' \
            --pattern '*.rpm' \
            || echo "no matching assets"

      - name: Scan with VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Requires the VIRUSTOTAL_API_KEY repository secret (free public key).
          python .github/scripts/vt_scan.py \
            --assets-dir scan-assets \
            --tag "${{ github.ref_name }}"

      - name: Publish report + release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f VIRUSTOTAL-REPORT.md ]; then
            gh release upload "${{ github.ref_name }}" VIRUSTOTAL-REPORT.md --clobber
          else
            echo "VIRUSTOTAL-REPORT.md not produced; skipping report upload"
          fi
          # Only rewrite the release body if the script produced notes; otherwise
          # leave the existing changelog untouched (defense-in-depth).
          if [ -f release-notes.md ]; then
            gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
          else
            echo "release-notes.md not produced; leaving release body unchanged"
          fi
